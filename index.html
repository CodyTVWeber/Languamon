<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua Legends GB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="shell">
        <section class="hud">
            <h1 class="hud-title">Lingua Legends GB</h1>
            <div class="hud-panel">
                <span id="hud-track">Track: —</span>
                <span id="hud-progress">Lexicon: 0 / 0</span>
                <span id="hud-level">Rank: 1</span>
            </div>
            <div class="hud-feed" id="hud-feed"></div>
            <p class="hud-hint">Arrow keys / WASD move • Space interacts • Enter confirms • L opens LexiLog</p>
        </section>
        <section class="cabinet">
            <div class="cabinet-top">
                <div class="speaker">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="power-led"></div>
            </div>
            <div class="screen">
                <div id="game-root" class="game-root"></div>
                <div class="scanlines"></div>
            </div>
            <div class="cabinet-label">LINGUA BOY ADVANCE</div>
        </section>
    </main>
    <script type="module" src="game.js"></script>
</body>
</html>
