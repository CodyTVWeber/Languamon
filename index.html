<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua Legends GB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-surface">
        <div id="game-root" class="game-root"></div>
        <div class="hud-overlay">
            <h1 class="hud-title">Lingua Legends GB</h1>
            <div class="hud-panel">
                <span id="hud-track">Track: —</span>
                <span id="hud-progress">Lexicon: 0 / 0</span>
                <span id="hud-level">Rank: 1</span>
            </div>
            <div class="hud-feed" id="hud-feed"></div>
            <p class="hud-hint">Arrow keys / WASD move • Space or A interacts • Enter confirms • L button opens LexiLog • Tap controls on touch</p>
        </div>
        <div class="scanlines" aria-hidden="true"></div>
    </div>
    <div class="mobile-controls">
        <div class="mobile-pad">
            <span class="pad-void" aria-hidden="true"></span>
            <button class="pad-btn" data-direction="up" aria-label="Move up">▲</button>
            <span class="pad-void" aria-hidden="true"></span>
            <button class="pad-btn" data-direction="left" aria-label="Move left">◀</button>
            <div class="pad-center" aria-hidden="true"></div>
            <button class="pad-btn" data-direction="right" aria-label="Move right">▶</button>
            <span class="pad-void" aria-hidden="true"></span>
            <button class="pad-btn" data-direction="down" aria-label="Move down">▼</button>
            <span class="pad-void" aria-hidden="true"></span>
        </div>
        <div class="mobile-actions">
            <button class="aux-btn" data-action="lexilog" aria-label="Open LexiLog">L</button>
            <div class="action-cluster">
                <button class="action-btn action-b" data-action="back" aria-label="Back or retreat">B</button>
                <button class="action-btn action-a" data-action="confirm" aria-label="Confirm or interact">A</button>
            </div>
        </div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
